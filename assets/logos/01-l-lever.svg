<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LeverageIQ — L lever mark">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00AAFF"/>
      <stop offset="1" stop-color="#7dd6ff"/>
    </linearGradient>
    <linearGradient id="g1-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#001829"/>
      <stop offset="1" stop-color="#003a5c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g1)"/>
  <!-- The L: vertical bar + tilted horizontal "lever" -->
  <g fill="url(#g1-stroke)">
    <rect x="18" y="14" width="9" height="36" rx="3"/>
    <rect x="18" y="40" width="32" height="9" rx="3" transform="rotate(-15 18 44.5)"/>
  </g>
</svg>
